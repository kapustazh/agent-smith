[project]
name = "Agent_Smith"
version = "0.1.0"
description = "Agent Smith = Code Agent - use LLMs to write, execute and test code on Python."
requires-python = ">=3.11"
authors = [{ name="Matvii Nesterenko", email="work@kapustazh.dev" },
	   { name="Irek Iunusov", email="iiunusov@student.42heilbronn.de" },
	   { name="Oleksandr Bachurin", email="bachurin_s@yahoo.de" }]
dependencies = [
	"pydantic>=2.11.9",
	"pydantic-settings",
	"flake8>=7.0",
	"mypy>=1.0",
	"dotenv",
	"typer",
	"deno",
	"openai",
	"fastmcp",
	"jedi>=0.19.2,<0.21",
	"regex>=2024.11.6",
#	"transformers>=4.40.0",
#	"sentence_transformers>=5.7.0",
#	"torch>=2.0.0",
#	"mcpbr",
#	"mbpp",
    ]

readme = "README.md"

[tool.uv]
package = true

# packages = [{ include = "src" }] 

[tool.setuptools]
package-dir = {"" = "."} 

[dependency-groups]
dev = [
    "types-tqdm>=4.70.0.20260805",
]

[project.scripts]
sandbox = "sandbox:app"
# index = "src.__main__:main" 

[tool.mypy]
python_version = "3.10" 

ignore_missing_imports = true

